<!DOCTYPE html>
<!-- PD-004 规则维护 原型 | FR-007/FR-008 | PM-Agent | 2026-10-28 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敏货看台 · 规则维护</title>
<style>
  :root{
    --bg:#f5f7fa;--card:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;
    --primary:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--ok-bg:#f0fdf4;
    --warn-bg:#fffbeb;--bad-bg:#fef2f2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  a{text-decoration:none;color:inherit}
  .nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 20px;height:52px;z-index:10}
  .nav .logo{font-weight:700;color:var(--primary);margin-right:18px;font-size:15px}
  .nav a.tab{padding:6px 12px;border-radius:6px;color:var(--muted)}
  .nav a.tab.active{background:#eff6ff;color:var(--primary);font-weight:600}
  .nav a.tab:hover{color:var(--primary)}
  .nav .quick{margin-left:auto;display:flex;gap:6px}
  .nav .quick input{border:1px solid var(--line);border-radius:6px;padding:5px 10px;width:180px;outline:none}
  .nav .quick input:focus{border-color:var(--primary)}
  .wrap{max-width:1080px;margin:20px auto;padding:0 20px}
  .page-h{margin-bottom:14px}
  .page-h h1{font-size:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:10px}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
  .form-grid .full{grid-column:1/-1}
  .field label{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
  .field label b{color:var(--bad)}
  select,input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;outline:none;font-size:13px;font-family:inherit}
  select:focus,input:focus,textarea:focus{border-color:var(--primary)}
  .field.err select,.field.err input,.field.err textarea{border-color:var(--bad);background:var(--bad-bg)}
  textarea{resize:vertical;min-height:56px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:#1d4ed8;color:#fff}
  .actions{margin-top:10px;display:flex;gap:10px;align-items:center}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;font-size:13px}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
  .b-ACCEPTABLE{background:var(--ok-bg);color:var(--ok);border-color:#bbf7d0}
  .b-CONDITIONAL{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
  .b-FORBIDDEN{background:var(--bad-bg);color:var(--bad);border-color:#fecaca}
  .link{color:var(--primary);cursor:pointer;background:none;border:none;font-size:13px;padding:0}
  .rev-panel{background:#f8fbff;border:1px solid #bfdbfe;border-radius:8px;padding:12px 14px;margin:6px 0 14px}
  .rev-panel .loc{font-size:13px;margin-bottom:8px}
  .msg{padding:9px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none}
  .msg.ok{background:var(--ok-bg);border:1px solid #bbf7d0;color:var(--ok)}
  .msg.bad{background:var(--bad-bg);border:1px solid #fecaca;color:var(--bad)}
  .msg a{color:var(--primary);text-decoration:underline}
  .filters{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .filters label{color:var(--muted);font-size:13px}
  .muted{color:var(--muted)}.small{font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:36px 0}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin:26px 0 10px}
</style>
</head>
<body>
<div class="nav">
  <span class="logo">敏货看台</span>
  <a class="tab" href="PD-001_现状总览.html">现状总览</a>
  <a class="tab" href="PD-002_分地区视图.html">分地区视图</a>

  <span class="quick"><input type="text" id="quick" placeholder="品名快捷搜索（中/英）"></span>
</div>
<div class="wrap">
  <div class="page-h"><h1>规则维护</h1></div>
  <div class="msg" id="msg"></div>

  <div class="panel">
    <h2>① 登记新规则（简版表单 · 提交即生效，无审核流）</h2>
    <div class="form-grid">
      <div class="field" data-f="zh"><label>品名（中文）<b>*</b></label><input type="text" id="r-zh" placeholder="如：锂电池"></div>
      <div class="field" data-f="en"><label>品名（英文）<b>*</b></label><input type="text" id="r-en" placeholder="如：Lithium Battery"></div>
      <div class="field" data-f="region"><label>大区<b>*</b></label><select id="r-region"></select></div>
      <div class="field" data-f="source"><label>信源<b>*</b></label><select id="r-source"></select></div>
      <div class="field" data-f="status"><label>状态<b>*</b></label><select id="r-status"></select></div>
      <div class="field" data-f="operator"><label>登记人<b>*</b></label><input type="text" id="r-operator" placeholder="如：关务-张明"></div>
      <div class="field full" data-f="basis"><label>依据<b>*</b></label><textarea id="r-basis" placeholder="信源出处摘要（必填），如：(样例)商务部公告第 XX 号…"></textarea></div>
      <div class="field full"><label>备注（选填）</label><input type="text" id="r-note" placeholder="如：海二适用性：需调整"></div>
    </div>
    <div class="actions"><button class="btn btn-primary" id="r-submit">提交登记</button>
      <span class="small muted">同「品类×大区×信源」已有规则时将引导转修订</span></div>
  </div>

  <div class="panel">
    <h2>② 规则列表</h2>
    <div class="filters">
      <label>品类关键字</label><input type="text" id="q-kw" placeholder="中/英包含匹配">
      <label>大区</label><select id="q-region"></select>
      <label>信源</label><select id="q-source"></select>
      <button class="btn" id="q-reset">重置</button>
    </div>
    <table>
      <thead><tr><th>品类</th><th>大区</th><th>信源</th><th>状态</th><th>依据摘要</th><th>操作者</th><th>更新时间</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">当前检索条件下无规则</div>
  </div>
</div>
<div class="foot">敏货看台 v1.0.0 原型 · 样例数据（虚构） · FR-007/008 · 登记不产生变化记录，修订自动留痕</div>

<script>
/* ===== 样例数据（与 PD-001 同源）===== */
const REGIONS=[["EU","欧洲"],["NA","北美"],["ME","中东"],["SEA","东南亚"],["OTHER","其他"]];
const SOURCES=[["POLICY","国家政策"],["CUSTOMS","海关"],["LOGISTICS","头部物流"],["CARRIER","船司"],["PORT","目的港"]];
const STATUS=[["ACCEPTABLE","可接"],["CONDITIONAL","敏感"],["FORBIDDEN","不可接"]];
const zhOf=(arr,k)=>{const f=arr.find(x=>x[0]===k);return f?f[1]:k};
const CATEGORIES=[
 [1,"锂电池","Lithium Battery"],[2,"内置电池电子产品","Electronics with Built-in Battery"],
 [3,"纯电动汽车","Pure Electric Vehicle"],[4,"二手锂电电动车","Second-hand Lithium EV"],
 [5,"电子烟","E-cigarette (ENDS)"],[6,"干燥食品","Dried Food"],[7,"食品罐头","Canned Food"],
 [8,"膳食补充剂","Dietary Supplements"],[9,"含酒精化妆品","Alcohol-containing Cosmetics"],
 [10,"硅胶制品","Silicone Products"],[11,"润滑油","Lubricating Oil"],[12,"原木制品","Log Wood Products"],
 [13,"木质包装","Wooden Packaging (IPPC)"],[14,"雕刻机","Engraving Machine"],[15,"数控机床","CNC Machine Tool"],
 [16,"大功率激光设备","High-power Laser Equipment"],[17,"侵权仿牌服装","Imitation Brand Apparel"],
 [18,"钢卷","Steel Coil"],[19,"对讲机","Walkie-talkie"],[20,"无人机","Drone (UAV)"],
 [21,"枪套","Gun Holster"],[22,"烟花","Fireworks"]];
const RULES=[
 [1,1,"EU","POLICY","CONDITIONAL","(样例)欧盟电池法规：需提供合规证明与检测报告方可出运","关务-张明","2026-09-12"],
 [2,1,"EU","CARRIER","FORBIDDEN","(样例)船司公告：锂电池订舱需全套危包资料（MSDS+海运报告+38.3），资料不全一律不接","关务-张明","2026-09-12"],
 [3,1,"SEA","CARRIER","CONDITIONAL","(样例)船司：内置电产品需 MSDS+38.3 测试报告，可条件承接","关务-李华","2026-08-25"],
 [4,2,"SEA","CARRIER","CONDITIONAL","(样例)船司审核要求：内置电池电子产品需提交 MSDS 与海运报告","关务-李华","2026-08-25"],
 [5,3,"NA","CARRIER","CONDITIONAL","(样例)船司：纯电动车必须按 9 类危险品申报，需全套危包资料","关务-王芳","2026-09-02"],
 [6,4,"NA","CARRIER","FORBIDDEN","(样例)船司差异化审核：绝对禁止承接二手锂电电动车","关务-李华","2026-08-30"],
 [7,5,"NA","CUSTOMS","FORBIDDEN","(样例)FDA 进口警报：电子烟列入无需检验即扣留（DWPE）红名单","关务-张明","2026-10-08"],
 [8,5,"NA","LOGISTICS","CONDITIONAL","(样例)头部物流：电子烟专线有条件收寄（需渠道报备）","关务-张明","2026-09-15"],
 [9,6,"OTHER","LOGISTICS","ACCEPTABLE","(样例)头部物流可收寄清单：干燥食品类可正常收寄","关务-王芳","2026-08-18"],
 [10,7,"NA","PORT","FORBIDDEN","(样例)目的港：食品罐头资质不全即扣留，温控风险高，禁止承接","关务-李华","2026-09-18"],
 [11,8,"NA","CUSTOMS","CONDITIONAL","(样例)FDA：膳食补充剂需事前注册与事前申报，资质不全扣留","关务-王芳","2026-10-20"],
 [12,9,"EU","POLICY","CONDITIONAL","(样例)欧盟 REACH 限制物质清单：含酒精化妆品受限制，需成分核查","关务-张明","2026-08-28"],
 [13,10,"EU","LOGISTICS","ACCEPTABLE","(样例)头部物流可收寄清单：硅胶制品可正常收寄","关务-王芳","2026-08-18"],
 [14,11,"SEA","POLICY","CONDITIONAL","(样例)液体膏状类：需确认腐蚀性/易燃性后条件承接","关务-李华","2026-09-08"],
 [15,12,"NA","CUSTOMS","CONDITIONAL","(样例)海关：原木制品需 IPPC 熏蒸标识，无标识目的港拒绝入境","关务-李华","2026-08-22"],
 [16,13,"EU","CUSTOMS","CONDITIONAL","(样例)海关：木质包装必须烙印 IPPC 标识并附熏蒸证明","关务-张明","2026-08-22"],
 [17,14,"OTHER","POLICY","CONDITIONAL","(样例)两用物项管制清单：雕刻机属管制设备，逐单核查","关务-王芳","2026-09-25"],
 [18,15,"SEA","POLICY","ACCEPTABLE","(样例)东南亚：数控机床无针对性管制（不含两用物项型号）","关务-王芳","2026-10-02"],
 [19,16,"EU","POLICY","FORBIDDEN","(样例)出口管制公告：大功率激光器列入出口管制清单","关务-王芳","2026-10-14"],
 [20,17,"EU","CUSTOMS","FORBIDDEN","(样例)海关：侵权产品查没并牵连承运资质，严禁承接","关务-张明","2026-08-20"],
 [21,18,"NA","CARRIER","CONDITIONAL","(样例)船司：单件超 2 吨高密度重货，需提前申报仓位与特殊配载","关务-李华","2026-09-10"],
 [22,19,"SEA","LOGISTICS","ACCEPTABLE","(样例)头部物流可收寄清单：对讲机可正常收寄","关务-张明","2026-08-22"],
 [23,19,"SEA","CARRIER","CONDITIONAL","(样例)船司：对讲机需确认不含加密模块后有条件承接","关务-张明","2026-09-18"],
 [24,20,"ME","POLICY","ACCEPTABLE","(样例)中东市场：无针对性无人机禁运政策","关务-张明","2026-08-15"],
 [25,20,"ME","CUSTOMS","CONDITIONAL","(样例)海关：无人机需用途与最终用户申报核查","关务-张明","2026-09-01"],
 [26,20,"ME","CARRIER","FORBIDDEN","(样例)船司中东航线更新：拒收无人机整机","关务-张明","2026-09-28"],
 [27,20,"EU","CUSTOMS","CONDITIONAL","(样例)海关：无人机需用途与收货方核查","关务-李华","2026-08-30"],
 [28,21,"NA","CUSTOMS","FORBIDDEN","(样例)海关：枪套属涉军品，禁止承接（英文品名询价典型漏网样例）","关务-王芳","2026-09-06"],
 [29,22,"SEA","CARRIER","FORBIDDEN","(样例)船司 DG 清单：烟花全禁","关务-李华","2026-09-05"]];
const CHANGES=[
 [901,2,"CONDITIONAL","FORBIDDEN","(样例)船司更新锂电池订舱政策：资料不全一律不接","关务-张明","2026-09-12 10:32"],
 [902,26,"ACCEPTABLE","FORBIDDEN","(样例)船司中东航线更新：拒收无人机整机","关务-张明","2026-09-28 15:47"],
 [903,29,"CONDITIONAL","FORBIDDEN","(样例)船司 DG 清单更新：烟花全禁","关务-李华","2026-09-05 09:15"],
 [904,6,"CONDITIONAL","FORBIDDEN","(样例)船司差异化审核收紧：二手锂电电动车绝对禁接","关务-李华","2026-08-30 11:20"],
 [905,7,"CONDITIONAL","FORBIDDEN","(样例)FDA 进口警报更新：电子烟列入 DWPE 红名单","关务-张明","2026-10-08 14:03"],
 [906,18,"CONDITIONAL","ACCEPTABLE","(样例)东南亚目的国确认：该型号数控机床不涉两用物项","关务-王芳","2026-10-02 16:05"],
 [907,10,"ACCEPTABLE","FORBIDDEN","(样例)目的港更新食品管控：罐头类无完整资质即扣留","关务-李华","2026-09-18 13:40"],
 [908,19,"CONDITIONAL","FORBIDDEN","(样例)出口管制公告：大功率激光器列入管制","关务-王芳","2026-10-14 09:20"],
 [909,23,"FORBIDDEN","CONDITIONAL","(样例)船司放宽：确认无加密模块的对讲机可有条件承接","关务-张明","2026-08-22 17:12"],
 [910,11,"ACCEPTABLE","CONDITIONAL","(样例)FDA 注册要求更新：膳食补充剂需事前注册与申报","关务-王芳","2026-10-20 10:08"]];

/* ===== 共享逻辑 + 增量写入（localStorage：cats / rules / patches / changes）===== */
const LS="mhk_v100_";
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v));
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
const today=()=>now().slice(0,10);
function allCategories(){return CATEGORIES.concat(load("cats",[]))}
function allRules(){
  const ex=load("rules",[]);const patch=load("patches",{});
  return RULES.map(r=>{const p=patch[r[0]];return p?[r[0],r[1],r[2],r[3],p.status,p.basis||r[5],p.operator||r[6],p.updated]:r.slice()}).concat(ex);
}
function allChanges(){return load("changes",[]).concat(CHANGES)}
const badge=s=>`<span class="badge b-${s}">${zhOf(STATUS,s)}</span>`;
const $=id=>document.getElementById(id);
function showMsg(html,ok){const m=$("msg");m.className="msg "+(ok?"ok":"bad");m.innerHTML=html;m.style.display="block";m.scrollIntoView({behavior:"smooth",block:"center"})}

/* ===== 表单 ===== */
function fill(sel,arr,def){$(sel).innerHTML=arr.map(x=>`<option value="${x[0]}"${def===x[0]?" selected":""}>${x[1]}</option>`).join("")}
fill("r-region",REGIONS);fill("r-source",SOURCES);fill("r-status",STATUS,"ACCEPTABLE");
fill("q-region",REGIONS,"");$("q-region").insertAdjacentHTML("afterbegin",`<option value="">全部大区</option>`);
fill("q-source",SOURCES,"");$("q-source").insertAdjacentHTML("afterbegin",`<option value="">全部信源</option>`);
$("q-region").value="";$("q-source").value="";
function markErr(fields){document.querySelectorAll(".field").forEach(f=>f.classList.remove("err"));
  fields.forEach(k=>{const f=document.querySelector(`.field[data-f="${k}"]`);if(f)f.classList.add("err")})}
$("r-submit").onclick=()=>{
  const zh=$("r-zh").value.trim(),en=$("r-en").value.trim(),region=$("r-region").value,
        source=$("r-source").value,status=$("r-status").value,basis=$("r-basis").value.trim(),
        note=$("r-note").value.trim(),op=$("r-operator").value.trim();
  const miss=[];
  if(!zh)miss.push("zh");if(!en)miss.push("en");if(!basis)miss.push("basis");if(!op)miss.push("operator");
  if(miss.length){markErr(miss);showMsg("请填写必填项：" + miss.map(k=>({zh:"品名（中文）",en:"品名（英文）",basis:"依据",operator:"登记人"}[k])).join("、"),false);return}
  markErr([]);
  const cats=allCategories();
  let cat=cats.find(c=>c[1]===zh||c[2].toLowerCase()===en.toLowerCase());
  if(!cat){cat=[Math.max(1000,...cats.map(c=>c[0]))+1,zh,en];save("cats",load("cats",[]).concat([cat]));}
  const dup=allRules().find(r=>r[1]===cat[0]&&r[2]===region&&r[3]===source);
  if(dup){showMsg(`该品类在该大区×信源下已有规则（当前状态 ${zhOf(STATUS,dup[4])}），请改用修订。<button class="link" id="go-rev">转修订该规则</button>`,false);
    $("go-rev").onclick=()=>{openRev(dup[0])};return}
  const id=Math.max(1000,...allRules().map(r=>r[0]))+1;
  save("rules",load("rules",[]).concat([[id,cat[0],region,source,status,basis,op,today()]]));
  showMsg(`登记成功：「${zh} × ${zhOf(REGIONS,region)} × ${zhOf(SOURCES,source)}」已入库并即时生效（登记不产生变化记录）。新品类已自动建档：${cat[1]} / ${cat[2]}`,true);
  ["r-zh","r-en","r-basis","r-note"].forEach(i=>$(i).value="");
  render();
};

/* ===== 列表 + 修订 ===== */
let revOpenId=null;
function filtered(){
  const kw=$("q-kw").value.trim().toLowerCase(),rf=$("q-region").value,sf=$("q-source").value;
  const cats=allCategories(),catMap={};cats.forEach(c=>catMap[c[0]]=c);
  return allRules().filter(r=>{
    const c=catMap[r[1]];if(!c)return false;
    if(rf&&r[2]!==rf)return false;if(sf&&r[3]!==sf)return false;
    if(kw&&!(c[1].includes(kw)||c[2].toLowerCase().includes(kw)))return false;return true})
    .sort((a,b)=>String(b[7]).localeCompare(String(a[7])));
}
function revPanel(ruleId){
  const r=allRules().find(x=>x[0]===ruleId);const c=allCategories().find(x=>x[0]===r[1]);
  return `<tr><td colspan="8"><div class="rev-panel">
    <div class="loc">修订：${c[1]}（${c[2]}）× ${zhOf(REGIONS,r[2])} × ${zhOf(SOURCES,r[3])} ｜ 当前状态 ${badge(r[4])}</div>
    <div class="form-grid">
      <div class="field" data-f="nstatus"><label>新状态<b>*</b></label><select id="v-status"></select></div>
      <div class="field" data-f="noperator"><label>操作者<b>*</b></label><input type="text" id="v-operator" placeholder="修订人"></div>
      <div class="field full" data-f="nbasis"><label>修订依据<b>*</b></label><textarea id="v-basis" placeholder="本次变化依据（必填）"></textarea></div>
    </div>
    <div class="actions"><button class="btn btn-primary" onclick="doRev(${ruleId})">确认修订</button>
      <button class="btn" onclick="closeRev()">取消</button>
      <span class="small muted">状态变化将自动生成变化记录并即时反映到三视图</span></div>
  </div></td></tr>`;
}
function openRev(ruleId){revOpenId=ruleId;render();const p=document.querySelector(".rev-panel");if(p)p.scrollIntoView({behavior:"smooth",block:"center"});
  fill("v-status",STATUS,allRules().find(x=>x[0]===ruleId)[4])}
function closeRev(){revOpenId=null;render()}
function doRev(ruleId){
  const ns=$("v-status").value,nb=$("v-basis").value.trim(),no=$("v-operator").value.trim();
  const miss=[];if(!nb)miss.push("nbasis");if(!no)miss.push("noperator");
  if(miss.length){markErr(miss);showMsg("请填写必填项：" + miss.map(k=>({nbasis:"修订依据",noperator:"操作者"}[k])).join("、"),false);return}
  const r=allRules().find(x=>x[0]===ruleId);
  if(ns===r[4]){markErr(["nstatus"]);showMsg("状态未变化，无需修订（未产生变化记录）",false);return}
  markErr([]);
  const patch=load("patches",{});
  const isNew=r[0]>=1000&&load("rules",[]).some(x=>x[0]===r[0]);
  if(isNew){const rules=load("rules",[]).map(x=>x[0]===ruleId?[x[0],x[1],x[2],x[3],ns,nb,no,today()]:x);save("rules",rules)}
  else{patch[ruleId]={status:ns,basis:nb,operator:no,updated:today()};save("patches",patch)}
  const cid=Math.max(1000,...allChanges().map(c=>c[0]))+1;
  save("changes",load("changes",[]).concat([[cid,ruleId,r[4],ns,nb,no,now()]]));
  revOpenId=null;
  showMsg(`修订成功：已自动生成变化记录（${zhOf(STATUS,r[4])} → ${zhOf(STATUS,ns)}），三视图口径已即时切换。前往<a href="PD-003_变化记录.html">变化记录</a>查看`,true);
  render();
}
function render(){
  const rows=filtered();const cats=allCategories(),catMap={};cats.forEach(c=>catMap[c[0]]=c);
  $("rows").innerHTML=rows.map(r=>{
    const c=catMap[r[1]];
    const main=`<tr><td><b>${c[1]}</b><br><span class="muted small">${c[2]}</span></td><td>${zhOf(REGIONS,r[2])}</td><td>${zhOf(SOURCES,r[3])}</td>
      <td>${badge(r[4])}</td><td class="small">${String(r[5]).slice(0,36)}…</td><td class="small">${r[6]}</td><td class="small muted">${r[7]}</td>
      <td><button class="link" onclick="openRev(${r[0]})">修订</button></td></tr>`;
    return main+(revOpenId===r[0]?revPanel(r[0]):"");
  }).join("");
  $("empty").style.display=rows.length?"none":"block";
}
["q-kw","q-region","q-source"].forEach(id=>$(id).oninput=render);
$("q-reset").onclick=()=>{$("q-kw").value="";$("q-region").value="";$("q-source").value="";render()};
$("quick").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim())location.href="PD-005_品名查询.html?q="+encodeURIComponent(e.target.value.trim())});
render();
</script>
</body>
</html>
